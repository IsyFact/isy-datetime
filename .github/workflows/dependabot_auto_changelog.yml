name: Auto-Changelog for Dependabot Pull Requests

on:
  pull_request_target:
    branches:
      - develop
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  AddChangelogEntry:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Ensure Dependency Upgrades header exists at bottom
        run: |
          if ! grep -q '^### Dependency Upgrades' CHANGELOG.md; then
            # Append the header to the end of the file
            echo -e "\n### Dependency Upgrades\n" >> CHANGELOG.md
          fi

      - name: Generate or update changelog entry
        run: |
          title="${{ github.event.pull_request.title }}"
          # Extract package and new version from Dependabot title - support both chore and build prefixes
          pkg=$(echo "$title" | sed -E 's/^(chore|build)\(deps\): bump ([^ ]+) from [^ ]+ to [^ ]+$/\2/')
          version=$(echo "$title" | sed -E 's/^(chore|build)\(deps\): bump [^ ]+ from [^ ]+ to ([^ ]+)$/\2/')
          
          # For Maven packages, we want to keep the full name without capitalization
          pkg_cap="$pkg"
          
          # Format entry with bullet point
          entry="- Update von $pkg_cap auf Version $version"
          
          # Store extracted values as environment variables for use in the commit message
          echo "pkg_cap=$pkg_cap" >> $GITHUB_ENV
          echo "version=$version" >> $GITHUB_ENV
          
          # Check if an entry for this package already exists
          if grep -q "Update von $pkg_cap auf Version" CHANGELOG.md; then
            # Update existing entry
            sed -i -E "s/\- Update von $pkg_cap auf Version [0-9]+(\.[0-9]+)*(-[a-zA-Z0-9]+)?/\- Update von $pkg_cap auf Version $version/" CHANGELOG.md
            echo "Updated existing entry for $pkg_cap to version $version"
          else
            # Insert new entry under the header
            sed -i "/^### Dependency Upgrades/a $entry" CHANGELOG.md
            echo "Added new entry for $pkg_cap version $version"
          fi

      - name: Commit & push entry
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: |
            chore: adds changelog entry after upgrading ${{ env.pkg_cap }} to ${{ env.version }}
            
            * [dependabot skip]
          branch: ${{ github.event.pull_request.head.ref }}