name: Auto-Changelog for Dependabot Pull Requests

on:
  pull_request_target:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  pull-requests: write
  contents: write

jobs:
  add_changelog_entry:
    runs-on: ubuntu-latest
    # Run on dependabot PR events and on the follow-up commit created by this workflow
    if: ${{ github.actor == 'dependabot[bot]' || github.actor == 'github-actions[bot]' }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 3

      - name: Determine commit strategy
        id: commit_strategy
        shell: bash
        run: |
          last_author=$(git log -1 --pretty=%an || true)
          last_msg=$(git log -1 --pretty=%s || true)
          if [ "$last_author" = "github-actions[bot]" ] && echo "$last_msg" | grep -q "chore: adds changelog entry"; then
            echo "commit_options=--amend --no-edit" >> $GITHUB_OUTPUT
            echo "push_options=--force-with-lease" >> $GITHUB_OUTPUT
          else
            echo "commit_options=" >> $GITHUB_OUTPUT
            echo "push_options=" >> $GITHUB_OUTPUT
          fi

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.DEPENDABOT_TOKEN }}

      - name: Set package & version
        shell: bash
        run: |
          pkg=$(echo "${{ steps.metadata.outputs.dependency-names }}" | cut -d',' -f1)
          echo "pkg=$pkg" >> $GITHUB_ENV
          echo "new_version=${{ steps.metadata.outputs.new-version }}" >> $GITHUB_ENV
          echo "old_version=${{ steps.metadata.outputs.previous-version }}" >> $GITHUB_ENV

      - name: Set PR info
        shell: bash
        run: |
          echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "pr_url=https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Ensure Dependency Upgrades section
        shell: bash
        run: |
          # Create file if no changelog exists
          if [ ! -f CHANGELOG.md ]; then
            echo "# 0.0.0" > CHANGELOG.md
          fi

          # Determine the line number of the second version header
          second=$(grep -n '^# ' CHANGELOG.md | sed -n '2p' | cut -d: -f1)

          # Check if the "### DEPENDENCY UPGRADES" section is present before the second version header
          if ! head -n $((second-1)) CHANGELOG.md \
            | grep -q '^### DEPENDENCY UPGRADES'; then            
            if [ -z "$second" ]; then
              # No second version header found: trim file and append at end of file
              sed -i -e :a -e '/^\n*$/{$d;N;};/\n$/ba' CHANGELOG.md
              sed -i '$a\\n### DEPENDENCY UPGRADES\n' CHANGELOG.md
            else
              # Insert "### DEPENDENCY UPGRADES" one line before the second version header
              sed -i "$((second-1))a### DEPENDENCY UPGRADES\n" CHANGELOG.md
            fi
          fi

      - name: Add changelog entry
        shell: bash
        run: |
          tmp=$(mktemp)
          pkg_pattern="^- Update $pkg von Version "
          awk -v pkg_pattern="$pkg_pattern" 'BEGIN {blank=0} {
            if ($0 ~ pkg_pattern) next
            if ($0 ~ /^$/) {
              if (blank) next
              blank=1
            } else {
              blank=0
            }
            print
          }' CHANGELOG.md > "$tmp"
          mv "$tmp" CHANGELOG.md
          sed -i "/^### DEPENDENCY UPGRADES/a - Update \`$pkg\` von Version $old_version auf $new_version ([#$pr_number]($pr_url))" CHANGELOG.md

      - name: Commit & push entry
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: >
            chore: adds changelog entry after upgrading
            ${{ env.pkg }} from ${{ env.old_version }} to ${{ env.new_version }}
          branch: ${{ github.event.pull_request.head.ref }}
          commit_options: ${{ steps.commit_strategy.outputs.commit_options }}
          push_options: ${{ steps.commit_strategy.outputs.push_options }}
